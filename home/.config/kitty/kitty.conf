font_size                13
# no zsh injection; costs you prompt-jumping and output-capture shortcuts
shell_integration        disabled
# without integration kitty can't tell idle from busy and would confirm every close
confirm_os_window_close  0
# Arch's build never checks anyway; this only matters for kovid's own binaries
update_check_interval    0
# kinetic glide after a touchpad scroll. X11 has no "fingers lifted" event, so kitty
# guesses one after 50 ms without scroll events: pausing mid-scroll starts a glide,
# touching the pad does not stop it and repeated flicks stack their speed
momentum_scroll          0

include warm.conf

# (no Ctrl+Shift+Alt+C "copy the last command's output": it needs shell integration, off above)
map ctrl+shift+alt+a launch --stdin-source=@screen_scrollback --type=clipboard
background_opacity 0.92
