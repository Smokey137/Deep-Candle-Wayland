[global]
    font = Sans 10
    frame_width = 1
    frame_color = "#453937"
    separator_color = frame
    corner_radius = 8
    padding = 10
    horizontal_padding = 12
    text_icon_padding = 16
    gap_size = 6
    markup = full
    format = "<span foreground='#F7B922'><b>%s</b></span>\n%b"
    progress_bar = true
    progress_bar_height = 6
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 3
    progress_bar_min_width = 150
    progress_bar_max_width = 300
    min_icon_size = 24
    max_icon_size = 32
    icon_corner_radius = 4

[urgency_low]
    background = "#140C10"
    foreground = "#8A7470"
    frame_color = "#2C2323"
    highlight = "#9B59D0"

[urgency_normal]
    background = "#140C10"
    foreground = "#DCC8AE"
    frame_color = "#453937"
    highlight = "#C50ED2"

[urgency_critical]
    background = "#140C10"
    foreground = "#DCC8AE"
    frame_color = "#F24732"
    highlight = "#F24732"
