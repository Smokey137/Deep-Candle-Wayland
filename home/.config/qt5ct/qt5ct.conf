[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=@HOME@/.config/qt5ct/colors/warm.conf
icon_theme=Zafiro
standard_dialogs=default

[Fonts]
general="Sans Serif,10,-1,5,50,0,0,0,0,0"
fixed="Monospace,10,-1,5,50,0,0,0,0,0"

[Interface]
