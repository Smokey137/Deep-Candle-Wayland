# fuzzel: the launcher and every menu (power, Wi-Fi, sound, keys), in place of rofi.
# The Deep Candle look, from rofi's warm.rasi: the popup ground, the brown edge, amethyst for
# the prompt and the picked line. fuzzel by Daniel Eklöf (codeberg.org/dnkl/fuzzel).
# Colours are RRGGBBAA.

[main]
font=MD IO Trial:size=11,Iosevka Nerd Font:size=11
icons-enabled=no
anchor=center
width=48
lines=12
horizontal-pad=14
vertical-pad=14
inner-pad=8
line-height=20
match-counter=no
list-executables-in-path=no

[colors]
background=140c10d9
text=dcc8aeff
prompt=c50ed2ff
placeholder=8a7470ff
input=dcc8aeff
match=f7b922ff
selection=c50ed2ff
selection-text=fff2e6ff
selection-match=fff2e6ff
border=453937ff

[border]
width=1
radius=8
